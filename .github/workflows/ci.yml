name: Monorepo Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  powershell-tests:
    name: PowerShell Profile AST & Pester Tests
    runs-on: windows-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK for Type Accelerator Loading
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Build AgyTui Assembly
      run: dotnet build archive/agytui/AgyTui/AgyTui.csproj -c Release --verbosity quiet

    - name: Run Profile Verification Tests
      shell: powershell
      run: |
        ./shell/tests/run_tests.ps1

  dotnet-tests:
    name: C# AgyTui Control Center (.NET 9)
    runs-on: windows-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ hashFiles('archive/agytui/Directory.Packages.props', 'archive/agytui/*/*.csproj') }}
        restore-keys: |
          nuget-

    - name: Restore dependencies
      run: dotnet restore archive/agytui/AgyTui.slnx

    - name: Build solution
      run: dotnet build archive/agytui/AgyTui.slnx -c Release --no-restore -p:TreatWarningsAsErrors=true

    - name: Run unit & integration tests
      run: dotnet test archive/agytui/AgyTui.Tests/AgyTui.Tests.csproj -c Release --no-build --verbosity normal

  go-tests:
    name: Antigravity Go Suite (10 Applications)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22.x'

    - name: Run Test Suites Across All 10 Applications
      run: make test

    - name: Test Linux Binary Builds
      run: make build

    - name: Test Windows Binary Cross-Compilation
      run: make windows

