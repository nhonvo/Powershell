name: Monorepo Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  powershell-tests:
    name: PowerShell Profile AST & Pester Tests
    runs-on: windows-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK for Type Accelerator Loading
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Build AgyTui Assembly
      run: dotnet build apps/agytui/AgyTui/AgyTui.csproj -c Release --verbosity quiet

    - name: Run Profile Verification Tests
      shell: powershell
      run: |
        ./shell/tests/run_tests.ps1

  dotnet-tests:
    name: C# AgyTui Control Center (.NET 9)
    runs-on: windows-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ hashFiles('apps/agytui/Directory.Packages.props', 'apps/agytui/*/*.csproj') }}
        restore-keys: |
          nuget-

    - name: Restore dependencies
      run: dotnet restore apps/agytui/AgyTui.slnx

    - name: Build solution
      run: dotnet build apps/agytui/AgyTui.slnx -c Release --no-restore -p:TreatWarningsAsErrors=true

    - name: Run unit & integration tests
      run: dotnet test apps/agytui/AgyTui.Tests/AgyTui.Tests.csproj -c Release --no-build --verbosity normal

  go-tests:
    name: Go agyswitch Engine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agyswitch
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22.x'
        cache-dependency-path: apps/agyswitch/go.sum

    - name: Run Go unit tests
      run: go test -v -race ./...

    - name: Test Linux Binary Build
      run: go build -ldflags="-s -w" -o agyswitch-linux-amd64 .

    - name: Test Windows Binary Cross-Compilation
      run: GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o agyswitch-windows-amd64.exe .
