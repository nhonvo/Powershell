name: Run xUnit Unit Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
    - name: Restore dependencies
      run: dotnet restore csapp/AgyTui.slnx
    - name: Build solution
      run: dotnet build csapp/AgyTui.slnx --no-restore
    - name: Run unit tests
      run: dotnet test csapp/AgyTui.Tests/AgyTui.Tests.csproj --no-build --verbosity normal --collect:"XPlat Code Coverage"
